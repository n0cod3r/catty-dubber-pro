[package]
name = "catty-dubber-pro"
version = "0.1.0"
description = "Catty Dubber Pro desktop shell"
authors = ["n0cod3r"]
edition = "2021"

[lib]
name = "catty_dubber_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
