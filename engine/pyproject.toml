[project]
name = "catty-engine"
version = "0.1.0"
description = "Python AI and media engine for Catty Dubber Pro"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy>=2.2,<3",
  "pydantic>=2.12,<3",
  "sherpa-onnx>=2.0,<3",
  "funasr==1.4.16",
  "torch>=2.6,<3",
  "torchaudio>=2.6,<3",
  "transformers>=4.57,<5",
  "sentencepiece>=0.2,<1",
  "huggingface-hub>=0.30,<2",
  "keyring>=25.7.0",
  "mlx-lm>=0.29.1",
  "edge-tts>=7.2,<8",
  "voxcpm>=2.0.3,<3",
  "soundfile>=0.13,<1",
  "onnxruntime>=1.20,<2",
]

[project.scripts]
catty-engine = "catty_engine:main"

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "ruff>=0.14,<0.15",
  "mypy>=1.18,<2"
]

[[tool.mypy.overrides]]
module = ["sherpa_onnx", "funasr", "transformers", "edge_tts", "voxcpm", "soundfile", "onnxruntime"]
ignore_missing_imports = true
